<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Team Leader Dashboard</title>
    
    <!-- ライブラリの読み込み順序を厳密に管理 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/recharts@2.12.2/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
      body { background-color: #f8fafc; font-family: 'Inter', system-ui, sans-serif; }
      .loading-spin { animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .fade-in { animation: fadeIn 0.4s ease-out forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      
      .progress-bar {
        width: 0%;
        animation: progress 25s ease-in-out forwards;
      }
      @keyframes progress {
        0% { width: 0%; }
        20% { width: 15%; }
        50% { width: 60%; }
        80% { width: 85%; }
        100% { width: 95%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="flex h-screen items-center justify-center flex-col text-slate-400">
        <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full loading-spin mb-4"></div>
        <p>AI Team Leader を読み込み中...</p>
      </div>
    </div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;
      const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, Cell } = window.Recharts || {};

      const App = () => {
        const [fullData, setFullData] = useState(null);
        const [loading, setLoading] = useState(true);
        const [currentRole, setCurrentRole] = useState('Manager');
        const [error, setError] = useState(null);
        const [loadingStep, setLoadingStep] = useState(0);

        const loadingMessages = [
          "Google Tasksから最新ログを同期しています...",
          "メンバーごとのタスク完了パターンを抽出中...",
          "3ヶ月間の生活リズムの変化をAIが分析しています...",
          "要注意な停滞タスクのリスク判定を実行中...",
          "マネージャーへの推奨アクションを生成しています...",
          "ダッシュボードを構成中..."
        ];

        useEffect(() => {
          // ローディングメッセージを切り替えるタイマー
          const interval = setInterval(() => {
            setLoadingStep(function(prev) {
              return prev < loadingMessages.length - 1 ? prev + 1 : prev;
            });
          }, 4000);
          return function() { clearInterval(interval); };
        }, []);

        useEffect(() => {
          if (typeof google === 'undefined' || !google.script) {
            // モックデータ (デモ/プレビュー用)
            setTimeout(() => {
              setFullData({
                managerView: {
                  overallSummary: "[プレビュー] メンバーAさんの活動が3月に入り夜間にシフトし、延期も増加。早急なケアを推奨します。",
                  memberRisks: [{ name: "メンバーA", riskLevel: "High", reason: "平均完了時間が夜22時台へシフト。" }],
                  recommendedActions: [{ memberName: "メンバーA", type: "1on1", priority: "High", suggestion: "本日午後の1on1を推奨します。", messageTemplate: "最近遅くまでお疲れ様！少し状況を聞かせてほしいな。" }]
                },
                memberViews: {
                  "メンバーA": { stats: { total: 45, completed: 32, completionRate: 71, overdue: 4 }, advice: "朝型に戻すと楽になりますよ。", timeTrend: [{name: "Morning", count: 2}, {name: "Afternoon", count: 8}, {name: "Evening", count: 12}, {name: "Night", count: 10}], postponedTasks: [{name: "ハッカソン実装", count: 4, risk: "High"}] }
                }
              });
              setLoading(false);
            }, 3000);
            return;
          }

          // GAS関数の呼び出し
          google.script.run
            .withSuccessHandler(res => {
              if (!res) {
                setError("サーバーから空の応答が返されました。");
                setLoading(false);
              } else if (res.error) {
                setError(res.error);
                setLoading(false);
              } else {
                setFullData(res);
                setLoading(false);
              }
            })
            .withFailureHandler(err => {
              setError("GASエラー: " + err.message);
              setLoading(false);
            })
            .getDashboardData();
        }, []);

        useEffect(() => { 
          if (!loading && window.lucide) {
            window.lucide.createIcons(); 
          }
        }, [loading, currentRole, error]);

        if (error) return (
          <div className="flex h-screen items-center justify-center p-8 flex-col bg-slate-50 text-center">
            <div className="p-4 bg-rose-100 text-rose-600 rounded-3xl mb-6 shadow-sm"><i data-lucide="alert-circle" className="w-16 h-16 mx-auto"></i></div>
            <h2 className="text-2xl font-bold text-slate-800 mb-2">表示エラー</h2>
            <div className="bg-white border border-rose-200 p-4 rounded-2xl max-w-lg text-left overflow-auto max-h-60 mb-6">
              <code className="text-xs text-rose-500 break-all">{error}</code>
            </div>
            <button onClick={() => window.location.reload()} className="px-8 py-3 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg hover:bg-indigo-700 transition-colors">再読み込みを試す</button>
          </div>
        );

        if (loading) return (
          <div className="flex h-screen items-center justify-center flex-col bg-slate-50 text-center px-6">
            <div className="relative mb-10">
              {/* 二重のスピナーでよりリッチに */}
              <div className="w-20 h-20 border-4 border-indigo-100 rounded-full"></div>
              <div className="absolute top-0 left-0 w-20 h-20 border-4 border-indigo-600 border-t-transparent rounded-full loading-spin shadow-md"></div>
              <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
                <i data-lucide="brain-circuit" className="text-indigo-600 w-8 h-8 animate-pulse"></i>
              </div>
            </div>
            
            <div className="max-w-md w-full">
              <p className="text-slate-700 font-bold text-xl mb-2 tracking-tight transition-all duration-500">
                {loadingMessages[loadingStep]}
              </p>
              <p className="text-slate-400 text-sm mb-6">
                AIが過去の行動データを精査して、チームの状態を可視化しています。
              </p>
              
              {/* プログレスバー */}
              <div className="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden shadow-inner">
                <div className="bg-indigo-600 h-full progress-bar rounded-full"></div>
              </div>
              <div className="flex justify-between mt-2">
                <span className="text-[10px] font-bold text-slate-300 uppercase tracking-widest">Analytics Engine v2.5</span>
                <span className="text-[10px] font-bold text-indigo-400 uppercase tracking-widest animate-pulse">Processing...</span>
              </div>
            </div>
          </div>
        );

        const memberNames = Object.keys((fullData && fullData.memberViews) || {});

        return (
          <div className="min-h-screen">
            <header className="bg-white/80 backdrop-blur-md border-b px-6 py-4 sticky top-0 z-30 shadow-sm">
              <div className="max-w-6xl mx-auto flex justify-between items-center">
                <div className="flex items-center gap-3">
                  <div className="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-200"><i data-lucide="shield-check" className="text-white w-5 h-5"></i></div>
                  <h1 className="font-bold text-slate-800 text-xl tracking-tight hidden sm:block">AI Team Leader</h1>
                </div>
                <div className="flex bg-slate-100 p-1.5 rounded-2xl overflow-x-auto scrollbar-hide max-w-[60%]">
                  <button 
                    onClick={() => setCurrentRole('Manager')} 
                    className={`px-5 py-2 rounded-xl text-sm font-bold transition-all whitespace-nowrap ${currentRole === 'Manager' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'}`}
                  >
                    管理者
                  </button>
                  {memberNames.map(name => (
                    <button 
                      key={name} 
                      onClick={() => setCurrentRole(name)} 
                      className={`px-5 py-2 rounded-xl text-sm font-bold transition-all whitespace-nowrap ${currentRole === name ? 'bg-white shadow text-indigo-600' : 'text-slate-500'}`}
                    >
                      {name}
                    </button>
                  ))}
                </div>
              </div>
            </header>
            <main className="max-w-6xl mx-auto p-4 sm:p-8 fade-in space-y-8 pb-20">
              {currentRole === 'Manager' ? (
                <ManagerDashboard data={fullData.managerView} members={fullData.memberViews} />
              ) : (
                <MemberDashboard name={currentRole} view={fullData.memberViews[currentRole]} />
              )}
            </main>
          </div>
        );
      };

      const ManagerDashboard = ({ data, members }) => (
        <div className="space-y-8">
          <section className="bg-white p-6 sm:p-10 rounded-[2.5rem] border border-slate-200 shadow-sm relative overflow-hidden">
            <h2 className="text-2xl font-black mb-6 flex items-center gap-3 text-slate-800"><i data-lucide="sparkles" className="text-indigo-500"></i> AI 診断レポート</h2>
            <div className="bg-indigo-50 border border-indigo-100 p-6 sm:p-8 rounded-3xl mb-8">
              <p className="text-indigo-900 leading-relaxed text-lg font-medium">{(data && data.overallSummary) || "分析結果を取得中..."}</p>
            </div>
            
            <h3 className="font-bold text-lg mb-6 text-slate-700 flex items-center gap-2"><i data-lucide="zap" className="text-amber-500"></i> 推奨アクション (即時対応)</h3>
            <div className="grid md:grid-cols-2 gap-6">
              {(data && data.recommendedActions || []).map((action, i) => (
                <div key={i} className="bg-amber-50 border border-amber-100 p-6 rounded-3xl shadow-sm">
                  <div className="flex justify-between items-center mb-4">
                    <span className="font-black text-amber-900">{action.memberName}への対応</span>
                    <span className="bg-amber-200 text-amber-700 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest">優先度: {action.priority}</span>
                  </div>
                  <p className="text-amber-800 mb-4 font-bold">{action.suggestion}</p>
                  <div className="bg-white/80 p-4 rounded-2xl border border-amber-100 mb-4 shadow-inner">
                    <p className="text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-widest">通知案</p>
                    <p className="text-sm italic text-slate-600 leading-relaxed">"{action.messageTemplate}"</p>
                  </div>
                  <button onClick={() => window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=&su=1on1のお願い&body=${encodeURIComponent(action.messageTemplate)}`, '_blank')} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg hover:bg-indigo-700 transition-all">
                    <i data-lucide="send" className="w-4 h-4"></i> メール/Slackで通知
                  </button>
                </div>
              ))}
            </div>
          </section>

          <div className="grid md:grid-cols-2 gap-8">
            <div className="bg-white p-6 sm:p-8 rounded-[2rem] border border-slate-200 shadow-sm">
              <h3 className="font-bold text-lg mb-6 text-slate-700 flex items-center gap-2"><i data-lucide="alert-circle" className="text-rose-500"></i> 個別リスク分析</h3>
              <div className="space-y-4">
                {(data && data.memberRisks || []).map((risk, i) => (
                  <div key={i} className="flex items-start gap-4 p-5 bg-slate-50 rounded-2xl border border-slate-100">
                    <div className={`mt-1.5 w-3 h-3 rounded-full shrink-0 shadow-sm ${risk.riskLevel === 'High' ? 'bg-rose-500 animate-pulse' : 'bg-indigo-500'}`}></div>
                    <div><p className="font-black text-slate-800">{risk.name}</p><p className="text-sm text-slate-600 leading-relaxed mt-1">{risk.reason}</p></div>
                  </div>
                ))}
              </div>
            </div>
            <div className="bg-white p-6 sm:p-8 rounded-[2rem] border border-slate-200 shadow-sm">
              <h3 className="font-bold text-lg mb-6 text-slate-700 flex items-center gap-2"><i data-lucide="bar-chart-3" className="text-indigo-500"></i> チーム全体の達成状況</h3>
              <div className="space-y-8 pt-4">
                {Object.entries(members || {}).map(([name, mData]) => (
                  <div key={name}>
                    <div className="flex justify-between mb-2 items-end"><span className="font-bold text-slate-700">{name}</span><span className="font-black text-indigo-600 text-lg">{mData.stats.completionRate}%</span></div>
                    <div className="w-full bg-slate-100 h-4 rounded-full overflow-hidden shadow-inner"><div className="bg-indigo-600 h-full transition-all duration-1000 ease-out" style={{width: (mData.stats.completionRate || 0) + '%'}}></div></div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );

      const MemberDashboard = ({ name, view }) => (
        <div className="space-y-8">
          <section className="bg-gradient-to-br from-indigo-600 to-indigo-800 p-8 sm:p-12 rounded-[3.5rem] text-white shadow-xl relative overflow-hidden">
             <div className="absolute top-0 right-0 p-8 opacity-10"><i data-lucide="zap" className="w-48 h-48"></i></div>
            <h2 className="text-3xl font-black mb-10 tracking-tight">{name}さんのための分析結果</h2>
            <div className="bg-white/10 backdrop-blur-md p-8 rounded-3xl border border-white/20 shadow-inner"><p className="text-xl sm:text-2xl leading-relaxed italic font-medium tracking-tight">"{(view && view.advice) || "分析中..."}"</p></div>
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-10">
              <StatCard label="累計完了" value={(view && view.stats && view.stats.completed) || 0} />
              <StatCard label="期限切れ" value={(view && view.stats && view.stats.overdue) || 0} />
              <StatCard label="達成率" value={((view && view.stats && view.stats.completionRate) || 0) + '%'} />
              <StatCard label="総タスク" value={(view && view.stats && view.stats.total) || 0} />
            </div>
          </section>
          <div className="grid md:grid-cols-2 gap-8">
            <div className="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
              <h3 className="font-bold text-lg mb-8 text-slate-800 flex items-center gap-2"><i data-lucide="clock" className="text-indigo-500"></i> 最近の活動リズム</h3>
              <div className="h-64">
                <ResponsiveContainer width="100%" height="100%">
                  <BarChart data={(view && view.timeTrend) || []} margin={{top: 0, right: 0, left: -20, bottom: 0}}>
                    <XAxis dataKey="name" axisLine={false} tickLine={false} tick={{fontSize: 12, fontWeight: 'bold'}} />
                    <YAxis hide />
                    <Tooltip cursor={{fill: 'transparent'}} />
                    <Bar dataKey="count" radius={[10, 10, 10, 10]} barSize={45}>
                      {((view && view.timeTrend) || []).map((entry, index) => <Cell key={`cell-${index}`} fill={getBarColor(entry.name)} />)}
                    </Bar>
                  </BarChart>
                </ResponsiveContainer>
              </div>
            </div>
            <div className="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
              <h3 className="font-bold text-lg mb-8 text-slate-800 flex items-center gap-2"><i data-lucide="alert-triangle" className="text-rose-500"></i> 要注意タスク (停滞中)</h3>
              <div className="space-y-4">
                {(view && view.postponedTasks && view.postponedTasks.length > 0) ? view.postponedTasks.map((task, i) => (
                  <div key={i} className="flex justify-between items-center p-5 bg-slate-50 rounded-2xl hover:bg-slate-100 transition-all border border-transparent hover:border-rose-100">
                    <span className="font-bold text-slate-700 truncate pr-4">{task.name}</span>
                    <span className="bg-rose-100 text-rose-600 px-4 py-1.5 rounded-full text-xs font-black shadow-sm shrink-0">{task.count}回 延期</span>
                  </div>
                )) : <div className="text-center py-20 text-slate-400 font-medium">現在、停滞しているタスクはありません！</div>}
              </div>
            </div>
          </div>
        </div>
      );

      const StatCard = ({ label, value }) => (<div className="bg-white/10 p-5 rounded-2xl text-center border border-white/5"><p className="text-[10px] font-bold uppercase opacity-60 tracking-widest mb-1">{label}</p><p className="text-2xl sm:text-3xl font-black">{value}</p></div>);
      const getBarColor = (name) => { switch(name) { case 'Morning': return '#6366f1'; case 'Afternoon': return '#818cf8'; case 'Evening': return '#f59e0b'; case 'Night': return '#4338ca'; default: return '#cbd5e1'; } };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
